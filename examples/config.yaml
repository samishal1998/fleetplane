# yaml-language-server: $schema=https://raw.githubusercontent.com/samishal1998/fleetplane/main/schema/config.schema.json
# Fleetplane configuration (unknown fields are rejected at boot — ADR-007).
server:
  addr: ":8080"
  opsAddr: "127.0.0.1:9090"
  shutdownGrace: 20s

storage:
  path: /var/lib/fleetplane/fleetplane.db

# Credentials are ALWAYS secret:// references (07 §4).
providers:
  hetzner-main:
    driver: hetzner
    settings:
      token: secret://env/HETZNER_TOKEN
      location: fsn1
    # Billing overrides (docs/11): the hetzner driver already declares
    # hourly billing with a 5m termination buffer; override per kind, or
    # opt out with disabled: true.
    # billing:
    #   compute.machine:
    #     terminationBuffer: 3m
    #     adaptive: true      # p95-of-observed-deletes buffer (ADR-018)

# Classes are reusable creation templates (04 §2). reclaim.idleAfter makes
# idle poolless machines created from the class get deleted automatically.
classes:
  ci-large:
    kind: compute.machine
    provider: hetzner-main
    spec:
      serverType: cpx31
      image: "snapshot:ci-runner=v12"
      location: fsn1
    reclaim:
      idleAfter: 5m
    # Queue budget (docs/11 §8): acquisitions of this class wait for
    # existing/in-flight capacity before a new machine is created.
    # scheduling:
    #   queue:
    #     maxWait: 10m

# Static API tokens (generate with: fleetplane token new --name ci --perm resource.acquire ...)
auth:
  tokens: []
  # - id: 8f3a1c2d
  #   name: ci
  #   sha256: "<64 hex chars>"
  #   permissions: [resource.read, resource.acquire, operation.read]

engine:
  verifyWindow: 120s

reconcile:
  interval: 15s
  maxMutationsPerCycle: 5

acquire:
  pendingTimeout: 15m
